# 🚀 WebTestPDPA — web / api / pii / db (+ ollama เป็น profile เสริม)
# ⚠️ secret ทั้งหมดมาจาก .env เท่านั้น (สร้างด้วย scripts/new-env.ps1)

networks:
  # 📤 edge: มี egress (web, api ต้องออกไปเรียก LLM ภายนอกได้)
  edge: {}
  # ⚠️ internal: ไม่มี egress (pii, db อยู่ที่นี่เท่านั้น)
  internal:
    internal: true

volumes:
  pgdata: {}
  ollama: {}

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?missing POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?missing POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?missing POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  pii:
    build: ./pii
    environment:
      PII_SERVICE_TOKEN: ${PII_SERVICE_TOKEN:?missing PII_SERVICE_TOKEN}
      PII_NER_ENABLED: ${PII_NER_ENABLED:-true}
      PII_MAX_TEXT_LENGTH: ${PII_MAX_TEXT_LENGTH:-5000}
    networks: [internal]

  api:
    build: ./api
    depends_on:
      db:
        condition: service_healthy
      pii:
        condition: service_healthy
    environment:
      DB_CONNECTION: Host=db;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      PII_BASE_URL: http://pii:8000
      PII_SERVICE_TOKEN: ${PII_SERVICE_TOKEN:?missing PII_SERVICE_TOKEN}
      PII_TIMEOUT_SECONDS: ${PII_TIMEOUT_SECONDS:-5}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?missing JWT_SIGNING_KEY}
      JWT_ISSUER: ${JWT_ISSUER:-webtestpdpa}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-webtestpdpa-web}
      JWT_EXPIRES_MINUTES: ${JWT_EXPIRES_MINUTES:-60}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      VAULT_ENCRYPTION_KEY: ${VAULT_ENCRYPTION_KEY:?missing VAULT_ENCRYPTION_KEY}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?missing ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?missing ADMIN_PASSWORD}
      # 🚀 R7: รหัสผ่าน user พนักงาน (optional — ว่าง = ไม่สร้าง user พนักงาน)
      EMPLOYEE_SEED_PASSWORD: ${EMPLOYEE_SEED_PASSWORD:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-1024}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.3}
      LLM_HISTORY_LIMIT: ${LLM_HISTORY_LIMIT:-10}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-20}
      RETENTION_DAYS: ${RETENTION_DAYS:-30}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-180}
      RETENTION_INTERVAL_MINUTES: ${RETENTION_INTERVAL_MINUTES:-60}
    networks: [edge, internal]

  web:
    build: ./web
    depends_on: [api]
    ports:
      - "${WEB_PORT:-8080}:80"
    networks: [edge]

  # 🚀 เสริม: LLM ในเครื่อง (docker compose --profile ollama up)
  ollama:
    image: ollama/ollama
    profiles: ["ollama"]
    volumes:
      - ollama:/root/.ollama
    networks: [edge, internal]
